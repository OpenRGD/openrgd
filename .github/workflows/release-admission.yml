name: EXT-01B.4 release admission preview
on:
  pull_request:
    paths: ['contracts/release-admission/**', '.github/workflows/release-admission.yml']
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Protect prior contracts and source
        run: |
          git diff --exit-code 73c1380f4cbdff7ddca49cc6368bbe4fcb8fd276 HEAD -- spec standard src contracts/module-vocabulary contracts/module-publication contracts/publication-trust contracts/release-ledger contracts/build-provenance pyproject.toml
          git diff --check 73c1380f4cbdff7ddca49cc6368bbe4fcb8fd276 HEAD
      - name: Install test-only dependencies
        run: python -m pip install jsonschema==4.23.0 packaging==25.0 build==1.3.0 setuptools==80.9.0 wheel==0.45.1 'securesystemslib[crypto]==1.6.0'
      - name: Exact evidence and preview contract conformance
        env:
          PYTHONPATH: ${{ github.workspace }}/contracts/module-publication/v0.1.0:${{ github.workspace }}/contracts/publication-trust/v0.1.0:${{ github.workspace }}/contracts/release-ledger/v0.1.0:${{ github.workspace }}/contracts/build-provenance/v0.1.0:${{ github.workspace }}/contracts/release-admission/v0.1.0
        run: |
          python contracts/release-admission/v0.1.0/conformance.py
          python -O contracts/release-admission/v0.1.0/conformance.py
          python contracts/build-provenance/v0.1.0/conformance.py
          python contracts/release-ledger/v0.1.0/conformance.py
