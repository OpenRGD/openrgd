name: CORE-RI-01 candidate interoperability review
on:
  pull_request:
    branches: [main]
    paths: ['docs/reconciliation/ri/**', '.github/workflows/core-ri-conformance.yml']
permissions:
  contents: read
jobs:
  conformance:
    name: core-ri-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-reality-ingress
          ref: 5372f758df79c93fc887f3858d878635447f4a4d
          path: .upstream/ri
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/openrgd
          ref: 55a034ceb1cdaab8bed6848fcdde85c9436bc9e0
          path: .upstream/core-b
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/openrgd
          ref: fa5e8ff713a28b69b7d39b2c18e8c9e0f6c72ee0
          path: .upstream/core-c
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/openrgd
          ref: 7b15fda5c825f9359ce0045377ec38364de19efb
          path: .upstream/core-d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact independent source pins and scope
        run: |
          test "$(git -C .upstream/ri rev-parse HEAD)" = 5372f758df79c93fc887f3858d878635447f4a4d
          test "$(git -C .upstream/core-b rev-parse HEAD)" = 55a034ceb1cdaab8bed6848fcdde85c9436bc9e0
          test "$(git -C .upstream/core-c rev-parse HEAD)" = fa5e8ff713a28b69b7d39b2c18e8c9e0f6c72ee0
          test "$(git -C .upstream/core-d rev-parse HEAD)" = 7b15fda5c825f9359ce0045377ec38364de19efb
          git diff --exit-code afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD -- spec standard src contracts pyproject.toml
          git diff --check afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD
      - name: Install only offline schema test dependency
        run: python -m pip install jsonschema==4.23.0
      - name: Actual RI producer and pinned Core shapes (synthetic, not authority)
        env:
          PYTHONPATH: ${{ github.workspace }}/.upstream/ri/src
          RI_CHECKOUT: ${{ github.workspace }}/.upstream/ri
          CORE_B_CHECKOUT: ${{ github.workspace }}/.upstream/core-b
          CORE_C_CHECKOUT: ${{ github.workspace }}/.upstream/core-c
          CORE_D_CHECKOUT: ${{ github.workspace }}/.upstream/core-d
        run: |
          python docs/reconciliation/ri/conformance.py
          python -O docs/reconciliation/ri/conformance.py
      - name: Existing RI offline regressions (CV extras deliberately not installed)
        env:
          PYTHONPATH: ${{ github.workspace }}/.upstream/ri/src
        run: python -m unittest discover -s .upstream/ri/tests -v
