name: CORE-CAL-01C Foundation consistency candidate
on:
  pull_request:
    paths: ['contracts/foundation-consistency/**', '.github/workflows/foundation-consistency.yml']
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Protect existing spec, contracts and toolchain
        run: |
          git diff --exit-code cb23d15f8f08462aaf020d101732b9915d391115 HEAD -- spec standard src contracts/agent contracts/source-assessment contracts/source-conformance pyproject.toml
          git diff --check cb23d15f8f08462aaf020d101732b9915d391115 HEAD
      - name: Install unchanged toolchain and test dependencies
        run: python -m pip install -e . jsonschema==4.23.0 pytest
      - name: Real reference and independent non-BHL fixture review
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python contracts/foundation-consistency/v0.1.0/conformance.py
          python -O contracts/foundation-consistency/v0.1.0/conformance.py
      - name: Preserve 01A/B and existing Core regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python contracts/source-assessment/v0.1.0/conformance.py
          python contracts/source-conformance/v0.1.0/conformance.py
          python -m pytest -q
