name: CORE-CAL-01B scoped source conformance
on:
  pull_request:
    paths: ['contracts/source-conformance/**', '.github/workflows/source-conformance.yml']
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify protected source and exact 01A scope
        run: |
          git diff --exit-code ecb970e97ae9f8a86428b26ad67aa00f5dad1c08 HEAD -- spec standard src contracts/agent contracts/source-assessment pyproject.toml
          git diff --check ecb970e97ae9f8a86428b26ad67aa00f5dad1c08 HEAD
      - name: Install unchanged toolchain and test dependencies
        run: python -m pip install -e . jsonschema==4.23.0 pytest
      - name: Scoped reference and applicability tests (including real BHL)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python contracts/source-conformance/v0.1.0/conformance.py
          python -O contracts/source-conformance/v0.1.0/conformance.py
      - name: Previous source assessment and existing Core regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python contracts/source-assessment/v0.1.0/conformance.py
          python -m pytest -q
