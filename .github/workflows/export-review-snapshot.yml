name: Export review snapshot

on:
  push:
    branches:
      - artifact-export-1eb3a5ba

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create exact source snapshot
        shell: bash
        run: |
          git archive \
            --format=zip \
            --prefix=openrgd-review-1eb3a5ba/ \
            1eb3a5ba677f63635d9950ed06a6b281f2190aaa \
            -o openrgd-review-1eb3a5ba.zip
          sha256sum openrgd-review-1eb3a5ba.zip | tee openrgd-review-1eb3a5ba.sha256
          unzip -t openrgd-review-1eb3a5ba.zip

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: openrgd-review-snapshot-1eb3a5ba
          path: |
            openrgd-review-1eb3a5ba.zip
            openrgd-review-1eb3a5ba.sha256
          if-no-files-found: error
