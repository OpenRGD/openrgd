name: EXT-01B.3 scoped artifact verification
on:
  pull_request:
    paths: ['contracts/publication-trust/**', '.github/workflows/publication-trust.yml']
permissions:
  contents: read
jobs:
  wheel-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check exact protected baseline
        run: |
          git diff --exit-code 46fd178d2ccccdfb46f91d3cdafec1456dec5147 HEAD -- spec standard src contracts/agent contracts/module-publication contracts/module-vocabulary docs/history pyproject.toml
          git diff --check 46fd178d2ccccdfb46f91d3cdafec1456dec5147 HEAD
      - name: Install test-only pinned direct dependencies
        run: python -m pip install jsonschema==4.23.0 packaging==25.0 build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - name: Inspect real fixture wheel; negative archives
        env:
          PYTHONPATH: ${{ github.workspace }}/contracts/module-publication/v0.1.0:${{ github.workspace }}/contracts/publication-trust/v0.1.0
        run: |
          python contracts/publication-trust/v0.1.0/conformance.py
          python -O contracts/publication-trust/v0.1.0/conformance.py
