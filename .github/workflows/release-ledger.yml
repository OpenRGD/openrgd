name: EXT-01B.3C release ledger contract conformance
on:
  pull_request:
    paths: ['contracts/release-ledger/**', '.github/workflows/release-ledger.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify no prior source or contract changes
        run: |
          git diff --exit-code ce2d24ae056f29607c093c9dd289fa9205146a99 HEAD -- spec standard src contracts/agent contracts/module-publication contracts/module-vocabulary contracts/publication-trust docs/history pyproject.toml
          git diff --check ce2d24ae056f29607c093c9dd289fa9205146a99 HEAD
      - name: Install test-only direct dependencies
        run: python -m pip install jsonschema==4.23.0 packaging==25.0
      - name: Candidate state machine and evidence linkage
        env:
          PYTHONPATH: ${{ github.workspace }}/contracts/module-publication/v0.1.0:${{ github.workspace }}/contracts/publication-trust/v0.1.0:${{ github.workspace }}/contracts/release-ledger/v0.1.0
        run: |
          python contracts/release-ledger/v0.1.0/conformance.py
          python -O contracts/release-ledger/v0.1.0/conformance.py
