name: Evolution morphology candidate conformance
on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/evolution/**'
      - '.github/workflows/evolution-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-evolution:
    name: evol-v0.1-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']

    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install schema validation only
        run: python -m pip install 'jsonschema>=4.22,<5'
      - name: Verify canonical spec, strict mirror and core runtime unchanged
        run: |
          git diff --exit-code afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD -- spec standard src/openrgd pyproject.toml
      - name: Validate candidate maturity and schema
        run: python contracts/evolution/v0.1.0/validate.py
      - name: Run synthetic no-authority conformance
        run: |
          python contracts/evolution/v0.1.0/conformance.py
          python -O contracts/evolution/v0.1.0/conformance.py
      - name: Whitespace
        run: git diff --check afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD
