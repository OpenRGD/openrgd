name: Module vocabulary candidate conformance
on:
  pull_request:
    branches: [main]
    paths: ['contracts/module-vocabulary/**', 'docs/ecosystem/**', '.github/workflows/module-vocabulary.yml']
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-modules
          ref: 0268b3748042d04fd3561553616388368881e04a
          path: .upstream/registry
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-calibration
          ref: 81700401e2fa6d370a86b6c1f5a48802bc5f1fc7
          path: .upstream/cal
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify immutable pins and protected paths
        run: |
          test "$(git -C .upstream/registry rev-parse HEAD)" = 0268b3748042d04fd3561553616388368881e04a
          test "$(git -C .upstream/cal rev-parse HEAD)" = 81700401e2fa6d370a86b6c1f5a48802bc5f1fc7
          git diff --exit-code afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD -- spec standard src contracts/agent pyproject.toml
          git diff --check afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD
      - name: Install test-only schema dependency
        run: python -m pip install jsonschema==4.23.0
      - name: Offline vocabulary and existing registry discovery
        env:
          PYTHONPATH: ${{ github.workspace }}/.upstream/registry
          REGISTRY_CHECKOUT: ${{ github.workspace }}/.upstream/registry
          CAL_CHECKOUT: ${{ github.workspace }}/.upstream/cal
        run: |
          python contracts/module-vocabulary/v0.1.0/conformance.py
          python -O contracts/module-vocabulary/v0.1.0/conformance.py
