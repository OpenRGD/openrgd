name: EXT-01B module publication candidate conformance
on:
  pull_request:
    paths: ['contracts/module-publication/**', 'contracts/module-vocabulary/**', 'docs/history/extension-architecture/**', '.github/workflows/module-publication.yml']
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-modules
          ref: 8c50645b6fbc73d73a87a278bf2009fa83f3705d
          path: .upstream/registry
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-calibration
          ref: 81700401e2fa6d370a86b6c1f5a48802bc5f1fc7
          path: .upstream/cal
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify independent pins and protected paths
        run: |
          test "$(git -C .upstream/registry rev-parse HEAD)" = 8c50645b6fbc73d73a87a278bf2009fa83f3705d
          test "$(git -C .upstream/cal rev-parse HEAD)" = 81700401e2fa6d370a86b6c1f5a48802bc5f1fc7
          git diff --exit-code afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD -- spec standard src contracts/agent pyproject.toml
          git diff --check c8565926c9c4d8c91c916d2c1087205ef80fe531 HEAD
      - name: Install test-only schema dependency
        run: python -m pip install jsonschema==4.23.0
      - name: Historical schema and proposal conformance
        env:
          PYTHONPATH: ${{ github.workspace }}/.upstream/registry
          REGISTRY_CHECKOUT: ${{ github.workspace }}/.upstream/registry
          CAL_CHECKOUT: ${{ github.workspace }}/.upstream/cal
        run: |
          python contracts/module-publication/v0.1.0/conformance.py
          python -O contracts/module-publication/v0.1.0/conformance.py
          python -m unittest discover -s .upstream/registry/tests -v
          (cd .upstream/registry && python -m tools.generate_index --check)
