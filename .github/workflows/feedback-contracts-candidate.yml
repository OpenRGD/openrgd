name: Feedback Contracts candidate conformance

on:
  pull_request:
    paths:
      - 'contracts/feedback/v0.1.0/**'
      - '.github/workflows/feedback-contracts-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/feedback/v0.1.0/**'
      - '.github/workflows/feedback-contracts-candidate.yml'

permissions:
  contents: read

jobs:
  candidate-contracts:
    name: Candidate schemas and synthetic fixtures (no devices)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install standalone candidate-schema validator only
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Validate example flows and negative cases
        run: python -m unittest discover -s contracts/feedback/v0.1.0/tests -p 'check_*.py' -v
