name: Life Identity candidate conformance
on:
  pull_request:
    branches: [main]
    paths: ['contracts/identity/**', '.github/workflows/identity-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    name: core-c-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/openrgd
          ref: 55a034ceb1cdaab8bed6848fcdde85c9436bc9e0
          path: .upstream/core-b
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-cognition
          ref: a8ae925c9cacbce8bd7a6db01833d4159445d47a
          path: .upstream/cog
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify source pins and untouched compatibility surface
        run: |
          test "$(git -C .upstream/core-b rev-parse HEAD)" = 55a034ceb1cdaab8bed6848fcdde85c9436bc9e0
          test "$(git -C .upstream/cog rev-parse HEAD)" = a8ae925c9cacbce8bd7a6db01833d4159445d47a
          git diff --exit-code afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD -- spec standard src contracts/agent pyproject.toml
      - name: Install pinned dependencies and real legacy consumer
        run: |
          python -m pip install -r .upstream/cog/requirements-ci.txt -r .upstream/cog/requirements-rgd-ci.txt
          python -m pip install --no-build-isolation --no-deps -e . -e .upstream/cog
          python -m pip check
      - name: Candidate identity schema and semantic fixtures
        env:
          CORE_B_SCHEMA: ${{ github.workspace }}/.upstream/core-b/contracts/kernel/v0.1.0/schemas/kernel-goal-effect.schema.json
        run: |
          test -f "$CORE_B_SCHEMA"
          python contracts/identity/v0.1.0/validate.py
          python contracts/identity/v0.1.0/conformance.py
          python -O contracts/identity/v0.1.0/conformance.py
          python contracts/identity/v0.1.0/parser_conformance.py
          python -O contracts/identity/v0.1.0/parser_conformance.py
      - name: Existing Core-B conformance unchanged
        run: |
          python .upstream/core-b/contracts/kernel/v0.1.0/validate.py
          python .upstream/core-b/contracts/kernel/v0.1.0/conformance.py
      - name: Unchanged COG-01/02/C0/C1 regressions
        run: python -m unittest discover -s .upstream/cog/tests -v
      - name: Real COG-C1 stack against this Core
        env:
          RGD_CORE_CHECKOUT: ${{ github.workspace }}
        run: python -m unittest discover -s .upstream/cog/tests_integration -v
      - name: Whitespace
        run: git diff --check afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD
