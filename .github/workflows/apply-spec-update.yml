name: Apply reviewed spec update

on:
  push:
    branches:
      - restore-friendly-public-surface-v0.1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Verify and unpack reviewed payload
        shell: bash
        run: |
          cat .openrgd/spec-chunk-* > /tmp/spec-update.b64
          echo "d001b26246c200e4379df3590f2d2d3a9b4a06fa28ccdb15ad42f98671a0dfb7  /tmp/spec-update.b64" | sha256sum -c -
          base64 -d /tmp/spec-update.b64 > /tmp/spec-update.tgz
          echo "904a40cbd746435aa5d78e4af0cf3a389a9683fcfb6878fb3411d67ce7772a96  /tmp/spec-update.tgz" | sha256sum -c -
          mkdir -p /tmp/spec-update
          tar -xzf /tmp/spec-update.tgz -C /tmp/spec-update

      - name: Apply spec and public support files
        shell: bash
        run: |
          cp -a /tmp/spec-update/spec/. spec/
          cp -a /tmp/spec-update/support/. .

      - name: Install toolchain and tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Rebuild canonical integrity, mirror, and seed
        shell: bash
        run: |
          rgd hash --write
          rgd build-standard
          python - <<'PY'
          from pathlib import Path
          import shutil
          from openrgd.core.canonical import discover_source_paths

          root = Path.cwd()
          spec = root / "spec"
          seed = root / "src/openrgd/seeds/default/spec"
          selected = discover_source_paths(spec)
          expected = set()

          for source in selected:
              rel = source.relative_to(spec)
              expected.add(rel.as_posix())
              target = seed / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          for path in sorted(seed.rglob("*"), reverse=True):
              if path.is_file() and path.relative_to(seed).as_posix() not in expected:
                  path.unlink()
              elif path.is_dir() and not any(path.iterdir()):
                  path.rmdir()
          PY

      - name: Validate reviewed tree
        shell: bash
        run: |
          python tools/validate_repository.py
          python tools/validate_hygiene.py
          python tools/validate_artifacts.py
          python tools/validate_canonical_hash.py
          python tools/validate_runtime_boundary.py
          python contracts/agent/v0.1.0/validate.py
          python -m pytest -q

      - name: Remove temporary staging files
        shell: bash
        run: |
          rm -f .openrgd/spec-chunk-*
          rm -f .openrgd/spec-update.part*

      - name: Commit verified spec update to review branch
        shell: bash
        run: |
          git config user.name "Pasquale Ranieri"
          git config user.email "44770933+phate6872@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(spec): restore latest v0.2 profile and engineering targets"
          git push origin HEAD:restore-friendly-public-surface-v0.1
