name: CORE-CAL-01A source assessment candidate
on:
  pull_request:
    branches: [main]
    paths: ['contracts/source-assessment/**', '.github/workflows/source-assessment.yml']
permissions:
  contents: read
jobs:
  assessment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify protected source paths
        run: |
          git diff --exit-code afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD -- spec standard src pyproject.toml contracts/agent
          git diff --check afe1a831b950a4e6560f0285a0103fc4eaa343b7 HEAD
      - name: Install Core dependencies and test schema dependency
        run: python -m pip install 'typer>=0.9.0' 'rich>=13.0.0' jsonschema==4.23.0
      - name: Exact V1 source assessment and adversarial fixtures
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python contracts/source-assessment/v0.1.0/conformance.py
          python -O contracts/source-assessment/v0.1.0/conformance.py
  cal-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/openrgd
          ref: afe1a831b950a4e6560f0285a0103fc4eaa343b7
          path: .upstream/core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-calibration
          ref: 646dbc05bcefd15942b25bb55b3c99096f0cccc9
          path: .upstream/cal
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact CAL and Core pins
        run: |
          test "$(git -C .upstream/core rev-parse HEAD)" = afe1a831b950a4e6560f0285a0103fc4eaa343b7
          test "$(git -C .upstream/cal rev-parse HEAD)" = 646dbc05bcefd15942b25bb55b3c99096f0cccc9
      - name: Install test dependencies
        run: python -m pip install 'typer>=0.9.0' 'rich>=13.0.0' jsonschema==4.23.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build actual passive CAL binary (locked source, no devices)
        working-directory: .upstream/cal
        run: cargo build --locked --bin rgd-calibration
      - name: Independent real CAL and Core assessment exchange
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          CAL_TEST_CORE: ${{ github.workspace }}/.upstream/core
          CAL_CHECKOUT: ${{ github.workspace }}/.upstream/cal
          CAL_TEST_BINARY: ${{ github.workspace }}/.upstream/cal/target/debug/rgd-calibration
        run: |
          python contracts/source-assessment/v0.1.0/cal_conformance.py
          python -m unittest discover -s .upstream/cal/tests -p test_canonical_identity.py -v
