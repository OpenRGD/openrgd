name: OpenRGD CI

on:
  push:
    branches:
      - main
      - "restore-*"
      - "feature-*"
    tags:
      - "standard-v*"
      - "toolchain-v*"
      - "contracts-agent-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrgd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Check dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q src/openrgd
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Validate hygiene
        run: python tools/validate_hygiene.py
      - name: Validate canonical artifacts
        run: python tools/validate_artifacts.py
      - name: Validate canonical source hash
        run: python tools/validate_canonical_hash.py
      - name: Validate non-actuating runtime boundary
        run: python tools/validate_runtime_boundary.py
      - name: Validate candidate contracts
        run: python contracts/agent/v0.1.0/validate.py
      - name: CLI smoke test
        run: rgd --quiet --help
      - name: Run tests
        run: python -m pytest -q

  build-windows:
    name: Build Windows executable
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build executable
        shell: pwsh
        run: pyinstaller --clean rgd.spec
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/rgd.exe")) { throw "dist/rgd.exe was not produced" }
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrgd-rgd-windows
          path: dist/rgd.exe
          if-no-files-found: error
      - name: Publish tagged toolchain release asset
        if: startsWith(github.ref, 'refs/tags/toolchain-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rgd.exe
