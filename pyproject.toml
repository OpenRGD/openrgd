[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rgd"
version = "0.1.1"
description = "OpenRGD standard validation and interoperability toolchain"
authors = [
  { name = "Pasquale Ranieri" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",

    # TOML parsing for Python 3.10
    "tomli>=1.2.0; python_version<'3.11'",
]

[project.scripts]
rgd = "openrgd.main:run"

# External command plugins are not enabled in the canonical toolchain.
# A future plugin ABI requires an accepted contract and fail-closed loader.
[project.entry-points."rgd.commands"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openrgd" = ["seeds/**/*"]
